<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CODEFUTURO</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif; 
      margin: 0; 
      background: linear-gradient(135deg, #0a0a0a 0%, #2e2c1a 50%, #3e3716 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Animación de partículas de fondo */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }
    
    .particle {
      position: absolute;
      background: rgba(64, 224, 208, 0.5);
      border-radius: 50%;
      animation: float 15s infinite linear;
    }
    
    @keyframes float {
      0% {
        transform: translateY(0) translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-100vh) translateX(100px);
        opacity: 0;
      }
    }

    nav {
      background: rgba(0, 0, 0, 0.85); 
      padding: 15px 40px; 
      display: flex; 
      flex-direction: column;
      align-items: center;
      gap: 20px;
      border-bottom: 3px solid #FFEB3B;
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 5px 20px rgba(0,0,0,0.3);
    }
    
    nav .logo {
      color: #FFEB3B; 
      font-size: 2em; 
      font-weight: 800;
      text-align: center;
      text-shadow: 0 2px 10px rgba(255, 235, 59, 0.5);
      letter-spacing: 1px;
      position: relative;
    }
    
    nav .logo::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #40E0D0, transparent);
    }
    
    nav ul {
      list-style: none; 
      display: flex; 
      gap: 25px;
      justify-content: center;
      flex-wrap: wrap;
    }
    
    nav ul li a {
      color: #FFFFFF; 
      text-decoration: none; 
      font-weight: 500; 
      padding: 10px 20px;
      transition: all 0.3s ease;
      border-radius: 30px;
      border: 1px solid transparent;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    nav ul li a::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(64, 224, 208, 0.4), transparent);
      transition: left 0.5s;
    }
    
    nav ul li a:hover::before {
      left: 100%;
    }
    
    nav ul li a:hover {
      background: rgba(64, 224, 208, 0.15);
      border-color: #40E0D0;
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(64, 224, 208, 0.3);
    }
    
    nav ul li a.active {
      color: #40E0D0; 
      background: rgba(64, 224, 208, 0.2);
      border: 1px solid #40E0D0;
      box-shadow: 0 0 15px rgba(64, 224, 208, 0.4);
    }
    
    nav ul li a i {
      font-size: 1.1em;
    }
    
    footer {
      background: rgba(0, 0, 0, 0.9); 
      color: #40E0D0; 
      text-align: center; 
      padding: 25px; 
      margin-top: auto;
      width: 100%;
      border-top: 3px solid #FFEB3B;
      backdrop-filter: blur(5px);
    }
    
    footer p {
      font-size: 1.1em;
      letter-spacing: 1px;
    }
    
    /* Botón de idioma */
    .language-switcher {
      position: fixed;
      top: 20px;
      right: 40px;
      z-index: 101;
    }
    
    .language-btn {
      background: linear-gradient(135deg, #40E0D0 0%, #FFEB3B 100%);
      color: #0a0a0a;
      border: none;
      padding: 10px 20px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.9em;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(64, 224, 208, 0.4);
      text-decoration: none;
    }
    
    .language-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(64, 224, 208, 0.6);
    }
    
    .language-btn:active {
      transform: translateY(-1px);
    }
    
    .language-dropdown {
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 10px;
      background: rgba(0, 0, 0, 0.95);
      border-radius: 10px;
      padding: 10px 0;
      min-width: 150px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.5);
      border: 1px solid #40E0D0;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);
      transition: all 0.3s ease;
    }
    
    .language-dropdown.active {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }
    
    .language-option {
      padding: 10px 20px;
      color: #fff;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .language-option:hover {
      background: rgba(64, 224, 208, 0.2);
      color: #40E0D0;
    }
    
    .language-option.active {
      color: #FFEB3B;
      background: rgba(255, 235, 59, 0.1);
    }
    
    .flag-icon {
      width: 20px;
      height: 15px;
      border-radius: 2px;
      object-fit: cover;
    }

    /* NUEVO: Botón de Usuarios (Espejo del de idioma) */
    .user-switcher {
      position: fixed;
      top: 20px;
      left: 40px;
      z-index: 101;
    }

    /* CONTENEDOR PRINCIPAL - CENTRADO EXACTAMENTE */
    .content-wrapper {
      max-width: 1200px;
      margin: auto; /* Centrado vertical y horizontal */
      padding: 0 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      flex: 1;
      align-items: center; /* Centrado vertical de los elementos */
      justify-content: center; /* Centrado horizontal */
    }
    
    /* BARRA DE CONTENIDO DESPLAZABLE (ahora contenedor de formulario) */
    .scrollable-content {
      background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
      border-radius: 15px;
      padding: 0;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
      border: 2px solid #40E0D0;
      width: 100%;
      height: 600px; /* CAMBIADO: Altura aumentada para hacer los recuadros más grandes */
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    
    .content-header {
      background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
      padding: 25px 40px;
      border-bottom: 2px solid #FFEB3B;
      text-align: center;
    }
    
    .content-header h2 {
      font-size: 1.8em;
      margin: 0;
      color: #40E0D0;
      text-shadow: 0 2px 4px rgba(64, 224, 208, 0.3);
    }
    
    .scrollable-body {
      padding: 30px 40px;
      overflow-y: auto;
      flex: 1;
      height: calc(100% - 90px); /* Ajuste para llenar el espacio restante */
      display: flex;
      flex-direction: column;
      justify-content: center; /* Centrar contenido verticalmente */
    }
    
    /* ESTILOS DE FORMULARIO */
    .form-group {
      margin-bottom: 25px; /* CAMBIADO: Aumentado para igualar la distancia en ambos formularios */
      text-align: left;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #FFEB3B;
      font-weight: 500;
      font-size: 0.95em;
    }
    
    .form-group input {
      width: 100%;
      padding: 12px 15px;
      border-radius: 8px;
      border: 2px solid #333;
      background: #111;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      transition: all 0.3s ease;
    }
    
    .form-group input:focus {
      outline: none;
      border-color: #40E0D0;
      box-shadow: 0 0 10px rgba(64, 224, 208, 0.3);
    }
    
    .form-btn {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #40E0D0 0%, #FFEB3B 100%);
      color: #0a0a0a;
      font-weight: 700;
      font-size: 1em;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Poppins', sans-serif;
    }
    
    .form-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(64, 224, 208, 0.4);
    }
    
    /* Personalización de scrollbar */
    .scrollable-body::-webkit-scrollbar {
      width: 12px;
    }
    
    .scrollable-body::-webkit-scrollbar-track {
      background: #1a1a1a;
      border-radius: 10px;
      margin: 5px;
    }
    
    .scrollable-body::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #40E0D0 0%, #FFEB3B 100%);
      border-radius: 10px;
      border: 2px solid #1a1a1a;
    }
    
    .scrollable-body::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, #FFEB3B 0%, #40E0D0 100%);
    }

    /* Eliminar barra de scroll específicamente para el segundo formulario */
    .no-scroll {
      overflow-y: hidden !important;
    }
    
    /* RESPONSIVE */
    @media(max-width: 768px) {
      .content-wrapper {
        grid-template-columns: 1fr;
        padding: 0 15px;
        gap: 20px;
        margin: auto;
      }
      
      .scrollable-content {
        height: 500px; /* Altura ajustada para móvil */
      }
      
      .content-header {
        padding: 20px 30px;
      }
      
      .content-header h2 {
        font-size: 1.5em;
      }
      
      .scrollable-body {
        padding: 25px 30px;
      }
      
      nav {
        padding: 15px 20px;
      }
      
      nav ul {
        gap: 15px;
      }
      
      nav ul li a {
        padding: 6px 12px;
        font-size: 0.9em;
      }
      
      .language-switcher {
        right: 20px;
        top: 15px;
      }

      .user-switcher {
        left: 20px;
        top: 15px;
      }
      
      .language-btn {
        padding: 8px 16px;
        font-size: 0.85em;
      }
    }
    
    @media(max-width: 480px) {
      .content-header h2 {
        font-size: 1.3em;
      }
      
      .scrollable-content {
        height: 450px; /* Altura ajustada para móvil pequeño */
      }
      
      .scrollable-body {
        padding: 20px 25px;
      }
      
      nav ul {
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      
      nav ul li a {
        width: 200px;
        justify-content: center;
        text-align: center;
      }
      
      .language-switcher {
        position: fixed;
        top: 10px;
        right: 10px;
        margin-top: 0;
      }

      .user-switcher {
        position: fixed;
        top: 10px;
        left: 10px;
      }
    }
  </style>
</head>

<script>
  // Script para crear partículas animadas
  document.addEventListener('DOMContentLoaded', function() {
    const particlesContainer = document.getElementById('particles');
    const particleCount = 60;
    
    for (let i = 0; i < particleCount; i++) {
      createParticle();
    }
    
    function createParticle() {
      const particle = document.createElement('div');
      particle.classList.add('particle');
      
      // Tamaño aleatorio entre 5 y 15px
      const size = Math.random() * 10 + 5;
      particle.style.width = `${size}px`;
      particle.style.height = `${size}px`;
      
      // Posición inicial aleatoria
      particle.style.left = `${Math.random() * 100}%`;
      particle.style.top = `${Math.random() * 100}%`;
      
      // Duración de animación aleatoria
      const duration = Math.random() * 10 + 15;
      particle.style.animationDuration = `${duration}s`;
      
      // Retraso aleatorio para que no todas empiecen a la vez
      particle.style.animationDelay = `${Math.random() * 5}s`;
      
      particlesContainer.appendChild(particle);
      
      // Cuando termine la animación, reposicionar la partícula
      particle.addEventListener('animationiteration', function() {
        particle.style.left = `${Math.random() * 100}%`;
        particle.style.top = '100%';
      });
    }
    
    // Script para el selector de idioma
    const languageBtn = document.getElementById('languageBtn');
    const languageDropdown = document.getElementById('languageDropdown');
    const languageOptions = document.querySelectorAll('.language-option');
    
    // Textos en diferentes idiomas
    const translations = {
      es: {
        loginTitle: "Iniciar Sesión",
        registerTitle: "Crear Cuenta",
        labelEmail: "Correo Electrónico",
        labelPassword: "Contraseña",
        labelName: "Nombre",
        btnLogin: "Ingresar",
        btnRegister: "Registrarse",
        footer: "© CODEFUTURO | Colombia",
        user: "Usuarios",
        placeholderName: "Tu nombre",
        placeholderEmail: "ejemplo@correo.com",
        placeholderPassword: "********",
        titleName: "Solo se permiten letras",
        titlePassword: "La contraseña debe tener exactamente 6 caracteres",
        msgEmail: "Incluye un signo \"@\" en la dirección de correo electrónico.",
        msgName: "Utiliza un formato que coincida con el solicitado. Solo se permiten letras.",
        msgPassword: "Aumenta la longitud del texto a 6 caracteres como mínimo.",
        nav: {
          intro: "Introducción",
          mission: "Misión",
          vision: "Visión",
          values: "Valores",
          video: "Video empresarial",
          location: "Ubicación",
          services: "Servicios",
          payments: "Métodos de pago",
          contact: "Contactanos",
          about: "Conocenos más"
        }
      },
      en: {
        loginTitle: "Login",
        registerTitle: "Create Account",
        labelEmail: "Email Address",
        labelPassword: "Password",
        labelName: "Name",
        btnLogin: "Sign In",
        btnRegister: "Sign Up",
        footer: "© CODEFUTURO | Colombia",
        user: "Users",
        placeholderName: "Your name",
        placeholderEmail: "example@email.com",
        placeholderPassword: "********",
        titleName: "Only letters are allowed",
        titlePassword: "Password must be exactly 6 characters",
        msgEmail: "Please include an '@' in the email address.",
        msgName: "Please match the requested format. Only letters are allowed.",
        msgPassword: "Please lengthen this text to 6 characters or more.",
        nav: {
          intro: "Introduction",
          mission: "Mission",
          vision: "Vision",
          values: "Values",
          video: "Corporate video",
          location: "Location",
          services: "Services",
          payments: "Payment methods",
          contact: "Contact us",
          about: "Learn more about us"
        }
      }
    };
    
    // Cargar idioma guardado si existe
    const savedLanguage = localStorage.getItem('language') || 'es';
    if (savedLanguage === 'en') {
      translatePage('en');
      updateLanguageButton('en');
      updateActiveOption('en');
    }
    
    // Mostrar/ocultar dropdown
    languageBtn.addEventListener('click', function() {
      languageDropdown.classList.toggle('active');
    });
    
    // Cerrar dropdown al hacer clic fuera
    document.addEventListener('click', function(e) {
      if (!languageBtn.contains(e.target) && !languageDropdown.contains(e.target)) {
        languageDropdown.classList.remove('active');
      }
    });
    
    // Cambiar idioma
    languageOptions.forEach(option => {
      option.addEventListener('click', function() {
        const lang = this.getAttribute('data-lang');
        
        // Guardar preferencia de idioma
        localStorage.setItem('language', lang);
        
        // Actualizar botón
        updateLanguageButton(lang);
        
        // Actualizar opciones activas
        updateActiveOption(lang);
        
        // Traducir contenido
        translatePage(lang);
        
        // Cerrar dropdown
        languageDropdown.classList.remove('active');
      });
    });
    
    // Función para actualizar el botón de idioma
    function updateLanguageButton(lang) {
      languageBtn.innerHTML = `
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-translate" viewBox="0 0 16 16">
          <path d="M4.545 6.714 4.11 8H3l1.862-5h1.284L8 8H6.833l-.435-1.286zm1.634-.736L5.5 3.956h-.049l-.679 2.022z"/>
          <path d="M0 2a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v3h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-3H2a2 2 0 0 1-2-2zm2-1a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h7a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1zm7.138 9.995q.289.451.63.846c-.748.575-1.673 1.001-2.768 1.292.178.217.451.635.555.867 1.125-.359 2.08-.844 2.886-1.494.777.665 1.739 1.165 2.93 1.472.133-.254.414-.673.629-.89-1.125-.253-2.057-.694-2.82-1.284.681-.747 1.222-1.651 1.621-2.757H14V8h-3v1.047h.765c-.318.844-.74 1.546-1.272 2.13a6 6 0 0 1-.415-.492 2 2 0 0 1-.94.31z"/>
        </svg>
        ${lang === 'es' ? 'Español' : 'English'}
      `;
    }
    
    // Función para actualizar la opción activa
    function updateActiveOption(lang) {
      languageOptions.forEach(opt => opt.classList.remove('active'));
      document.querySelector(`.language-option[data-lang="${lang}"]`).classList.add('active');
    }
    
    // Función para traducir la página
    function translatePage(lang) {
      const t = translations[lang];
      
      // Actualizar títulos y textos
      document.getElementById('login-title').textContent = t.loginTitle;
      document.getElementById('register-title').textContent = t.registerTitle;
      
      document.getElementById('label-login-name').textContent = t.labelName;
      document.getElementById('label-login-email').textContent = t.labelEmail;
      document.getElementById('label-login-password').textContent = t.labelPassword;
      
      document.getElementById('label-register-name').textContent = t.labelName;
      document.getElementById('label-register-email').textContent = t.labelEmail;
      document.getElementById('label-register-password').textContent = t.labelPassword;
      
      document.getElementById('btn-login').textContent = t.btnLogin;
      document.getElementById('btn-register').textContent = t.btnRegister;
      
      document.getElementById('footer-text').textContent = t.footer;
      document.getElementById('user-text').textContent = t.user;
      
      // Actualizar placeholders y titles
      const nameInputs = [document.getElementById('login-name'), document.getElementById('register-name')];
      nameInputs.forEach(input => {
        input.placeholder = t.placeholderName;
        input.title = t.titleName;
      });
      
      const emailInputs = [document.getElementById('login-email'), document.getElementById('register-email')];
      emailInputs.forEach(input => {
        input.placeholder = t.placeholderEmail;
      });
      
      const passwordInputs = [document.getElementById('login-password'), document.getElementById('register-password')];
      passwordInputs.forEach(input => {
        input.placeholder = t.placeholderPassword;
        input.title = t.titlePassword;
      });
      
      // Actualizar navegación
      const navTexts = document.querySelectorAll('nav .nav-text');
      navTexts[0].textContent = t.nav.intro;
      navTexts[1].textContent = t.nav.mission;
      navTexts[2].textContent = t.nav.vision;
      navTexts[3].textContent = t.nav.values;
      navTexts[4].textContent = t.nav.video;
      navTexts[5].textContent = t.nav.location;
      navTexts[6].textContent = t.nav.services;
      navTexts[7].textContent = t.nav.payments;
      navTexts[8].textContent = t.nav.contact;
      navTexts[9].textContent = t.nav.about;
      
      // Actualizar el atributo lang del documento
      document.documentElement.lang = lang;
    }

    // FUNCIÓN PARA VALIDAR Y TRADUCIR LOS MENSAJES DE ERROR NATIVOS
    window.validateForm = function(form) {
      const lang = localStorage.getItem('language') || 'es';
      const t = translations[lang];
      
      let isValid = true;
      
      // Limpiar mensajes personalizados previos
      form.querySelectorAll('input').forEach(input => input.setCustomValidity(''));

      // Validar Nombre
      const nameInput = form.querySelector('input[name="name"]');
      if (nameInput.validity.patternMismatch) {
        nameInput.setCustomValidity(t.msgName);
        isValid = false;
      }

      // Validar Email
      const emailInput = form.querySelector('input[name="email"]');
      if (emailInput.validity.typeMismatch) {
        emailInput.setCustomValidity(t.msgEmail);
        isValid = false;
      }

      // Validar Contraseña
      const passInput = form.querySelector('input[name="password"]');
      if (passInput.validity.tooShort) {
        passInput.setCustomValidity(t.msgPassword);
        isValid = false;
      }

      // Si hay errores, reportarlos
      if (!isValid) {
        form.reportValidity();
        return false;
      }

      return true;
    };
  });
</script>
